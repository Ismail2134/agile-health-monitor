services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    ports:
      - '8090:8090'
    volumes:
      - pb_data:/pb/pb_data
    command: >
      sh -c "
      /pb/pocketbase serve --http=0.0.0.0:8090 &
      sleep 5
      /pb/pocketbase superuser upsert admin@healthmonitor.nl admin123456 2>/dev/null || true
      wait
      "
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8090/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - traefik

  setup:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['sh', '-c', 'sleep 5 && node setup-pb.mjs']
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      - PB_URL=http://pocketbase:8090
    networks:
      - traefik

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_POCKETBASE_IP: pocketbase
        VITE_POCKETBASE_PUBLIC_URL: http://pocketbase:8090
    ports:
      - '3000:3000'
    environment:
      - ORIGIN=https://health.agiledevops.nl
      - PB_URL=http://pocketbase:8090
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agile-health.rule=Host(`health.agiledevops.nl`)"
      - "traefik.http.services.agile-health.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true

volumes:
  pb_data:
