services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    ports:
      - '8090:8090'
    volumes:
      - pb_data:/pb/pb_data
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
    restart: unless-stopped

  setup:
    image: ghcr.io/ismail2134/agile-health-monitor:latest
    command: ['node', 'setup-pb.mjs']
    depends_on:
      - pocketbase
    environment:
      - PB_URL=http://pocketbase:8090

  app:
    image: ghcr.io/ismail2134/agile-health-monitor:latest
    ports:
      - '3000:3000'
    environment:
      - ORIGIN=https://health.agiledevops.nl
      - PB_URL=http://pocketbase:8090
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pb_data:
